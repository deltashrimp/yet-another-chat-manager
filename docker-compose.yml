# Single-container deployment (see internal/ideas/core-build.md §Deploy).
#
#   docker compose up -d --build
#
# Reads the token from ./.env (BOT_TOKEN, BOT_OWNER_ID, ...) and overrides
# the host-relative paths with container paths: the SQLite DB lives on the
# ./data volume, translations and the welcome message ship inside the image.
services:
  bot:
    build: .
    image: yacm:local
    restart: unless-stopped
    env_file: .env
    environment:
      # Compose `environment:` wins over `env_file:` for duplicated keys.
      DB_PATH: /data/bot.db
      I18N_DIR: /app/i18n
      WELCOME_MESSAGE: /app/resources/welcome-message-public.md
      POLL_TIMEOUT: "30"
      # DEFAULT_LANG / LOG_LEVEL come from ./.env and are fine as-is.
    volumes:
      - ./data:/data
      # Live resources (welcome message, AI personality files): edits on the
      # host apply without rebuilding the image (AI files via /aireload).
      # Relative paths in .env resolve against /app, e.g.
      # AI_RULES=./resources/personality/ruleset.md
      - ./resources:/app/resources:ro
    healthcheck:
      # Opens the DB (running migrations) and calls getMe against the
      # Telegram API — same check as ./build/bot --healthcheck. Runs with
      # the same unprivileged user as the bot, so any WAL/SHM file the
      # check (re)creates is owned by yacm, never by root — a root-owned
      # -wal/-shm would make the bot's writes fail with SQLITE_READONLY.
      test: ["CMD", "setpriv", "--reuid=yacm", "--regid=yacm", "--init-groups", "/app/bot", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Long polling has no in-flight HTTP to drain, but the sender queue
    # needs a moment to flush before the DB closes.
    stop_grace_period: 30s